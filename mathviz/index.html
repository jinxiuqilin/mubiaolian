<script>
/* ================= 通用 ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let prob=0,cur=0; // cur: 当前展示到的步骤(0-based)
const W=cv.width,H=cv.height;

function clearCanvas(bg){ctx.clearRect(0,0,W,H);ctx.fillStyle=bg||'#fcfdfb';ctx.fillRect(0,0,W,H);}

/* ================= 题 A：二次函数动点 ================= */
// y=-x²+2x+3, A(-1,0) B(3,0) C(0,3), P(x,-x²+2x+3), D(x,0), S△PBC=(3/2)x(3-x)
const A1={m:-1,sc:118,ox:300,oy:480}; // 数学坐标→屏幕
const ax=x=>A1.ox+x*A1.sc, ay=y=>A1.oy-y*A1.sc;
let px=1.5; // P 横坐标
const fA=x=>-x*x+2*x+3, SA=x=>1.5*x*(3-x);

function drawA(){
  clearCanvas();
  // 网格与坐标轴
  ctx.strokeStyle='#eef1ec';ctx.lineWidth=1;
  for(let gx=-1;gx<=4;gx++){ctx.beginPath();ctx.moveTo(ax(gx),0);ctx.lineTo(ax(gx),H);ctx.stroke();}
  for(let gy=-1;gy<=4;gy++){ctx.beginPath();ctx.moveTo(0,ay(gy));ctx.lineTo(W,ay(gy));ctx.stroke();}
  ctx.strokeStyle='#8a9a8f';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ax(-1.3),ay(0));ctx.lineTo(ax(4.1),ay(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(ax(0),ay(-1.1));ctx.lineTo(ax(0),ay(4.1));ctx.stroke();
  ctx.fillStyle='#6b7a70';ctx.font='13px sans-serif';ctx.fillText('x',ax(4.05),ay(0)-6);ctx.fillText('y',ax(0)+8,ay(4.05));
  // 抛物线
  ctx.strokeStyle='#3f6fb5';ctx.lineWidth=2.5;ctx.beginPath();
  for(let t=-1.15;t<=3.15;t+=0.02){const X=ax(t),Y=ay(fA(t));t===-1.15?ctx.moveTo(X,Y):ctx.lineTo(X,Y);}
  ctx.stroke();
  // 定点 A B C
  const pts=[[-1,0,'A'],[3,0,'B'],[0,3,'C']];
  pts.forEach(([X,Y,n])=>{dot(ax(X),ay(Y),'#c2564a');lab(n,ax(X)+10,ay(Y)-8,'#c2564a');});
  // P 与 D
  const py=fA(px);
  // 线段 BC（≥第2步）
  if(cur>=1){ctx.setLineDash([7,5]);ctx.strokeStyle='#b98a2f';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(ax(3),ay(0));ctx.lineTo(ax(0),ay(3));ctx.stroke();ctx.setLineDash([]);
    lab('BC: x+y=3',ax(1.1),ay(1.55),'#b98a2f');}
  // △PBC 填充（≥第3步）
  if(cur>=2){ctx.fillStyle='rgba(63,111,181,.16)';ctx.beginPath();
    ctx.moveTo(ax(px),ay(py));ctx.lineTo(ax(3),ay(0));ctx.lineTo(ax(0),ay(3));ctx.closePath();ctx.fill();}
  // PD 铅垂线
  ctx.setLineDash([4,4]);ctx.strokeStyle='#8a9a8f';ctx.beginPath();
  ctx.moveTo(ax(px),ay(py));ctx.lineTo(ax(px),ay(0));ctx.stroke();ctx.setLineDash([]);
  dot(ax(px),ay(py),'#2e7d5b',7);lab('P',ax(px)+12,ay(py)-6,'#2e7d5b');
  dot(ax(px),ay(0),'#8a9a8f');lab('D',ax(px)+6,ay(0)+18,'#8a9a8f');
  // S(x) 内嵌小图（≥第4步）
  if(cur>=3){
    const bx=640,by=70,bw=270,bh=150;
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.strokeStyle='#dfe4dc';
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();ctx.stroke();
    ctx.fillStyle='#6b7a70';ctx.font='12px sans-serif';ctx.fillText('S(x)=1.5x(3-x)',bx+12,by+20);
    ctx.strokeStyle='#c2564a';ctx.lineWidth=2;ctx.beginPath();
    for(let t=0;t<=3;t+=0.02){const X=bx+12+(t/3)*(bw-24),Y=by+bh-14-(SA(t)/3.4)*(bh-30);t===0?ctx.moveTo(X,Y):ctx.lineTo(X,Y);}
    ctx.stroke();
    const mx=1.5,dotX=bx+12+(px/3)*(bw-24),dotY=by+bh-14-(SA(px)/3.4)*(bh-30);
    dot(dotX,dotY,'#3f6fb5',5);
    dot(bx+12+(mx/3)*(bw-24),by+bh-14-(SA(mx)/3.4)*(bh-30),'#b98a2f',6);
    ctx.fillStyle='#b98a2f';ctx.fillText('x=1.5 最值点',bx+150,by+bh-30);
  }
  // 结论（≥第5步）
  if(cur>=4){chip(ax(px)-150,ay(py)+30,'S 最大 = 27/8（x=1.5 时）','#2e7d5b');}
}
function chip(x,y,t,c){ctx.font='13px sans-serif';const w=ctx.measureText(t).width+18;
  ctx.fillStyle='rgba(46,125,91,.12)';ctx.strokeStyle=c;
  ctx.beginPath();ctx.roundRect(x,y,w,26,8);ctx.fill();ctx.stroke();
  ctx.fillStyle=c;ctx.fillText(t,x+9,y+18);}
function dot(x,y,c,r){ctx.fillStyle=c||'#c2564a';ctx.beginPath();ctx.arc(x,y,r||5.5,0,7);ctx.fill();}
function lab(t,x,y,c){ctx.fillStyle=c||'#6b7a70';ctx.font='13px sans-serif';ctx.fillText(t,x,y);}

/* ================= 题 B：正方形折叠 ================= */
// 正方形边长6, A(0,0) B(6,0) C(6,6) D(0,6), E(6,3), F=(3.6,4.8), G=(4.5,6), DG=4.5
const A2={m:88,ox:200,oy:520};
const bx=x=>A2.ox+x*A2.m, byy=y=>A2.oy-y*A2.m;
let fold=180; // 折叠角度 0~180（slider 控制）
function reflect(t){ // B 沿 AE 折到 F 的过程：垂直分量 cosφ 缩放
  const Ax=0,Ay=0,Ex=6,Ey=3, Bx=6,By=0;
  const dx=Ex-Ax,dy=Ey-Ay,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const rx=Bx-Ax,ry=By-Ay, dotP=rx*ux+ry*uy; // 沿轴分量
  const px_=rx-dotP*ux, py_=ry-dotP*uy;       // 垂直分量
  const c=Math.cos(fold*Math.PI/180);
  return {x:Ax+dotP*ux+px_*c, y:Ay+dotP*uy+py_*c};
}
const FPT=reflect(180); // (3.6,4.8)
function drawB(){
  clearCanvas();
  const S=[[0,0],[6,0],[6,6],[0,6]];
  ctx.strokeStyle='#54655c';ctx.lineWidth=2;ctx.beginPath();
  S.forEach(([X,Y],i)=>i?ctx.lineTo(bx(X),byy(Y)):ctx.moveTo(bx(X),byy(Y)));ctx.closePath();ctx.stroke();
  const names=['A','B','C','D'];S.forEach(([X,Y],i)=>{dot(bx(X),byy(Y),'#54655c');lab(names[i],bx(X)-14,byy(Y)+(i===1?22:i===2?-8:i===0?22:-8),'#54655c');});
  const Ex=6,Ey=3;dot(bx(Ex),byy(Ey),'#c2564a');lab('E',bx(Ex)+10,byy(Ey)+5,'#c2564a');
  // 折痕 AE
  ctx.strokeStyle='#b98a2f';ctx.setLineDash([7,5]);ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(bx(0),byy(0));ctx.lineTo(bx(Ex),byy(Ey));ctx.stroke();ctx.setLineDash([]);
  // 折叠中的 △ABE
  const f=reflect(); const Bp={x:f.x,y:f.y};
  ctx.fillStyle='rgba(63,111,181,.14)';ctx.strokeStyle='#3f6fb5';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(bx(0),byy(0));ctx.lineTo(bx(Bp.x),byy(Bp.y));ctx.lineTo(bx(Ex),byy(Ey));ctx.closePath();ctx.fill();ctx.stroke();
  dot(bx(Bp.x),byy(Bp.y),'#3f6fb5');lab(fold>=179.5?'F':`B′`,bx(Bp.x)+12,byy(Bp.y)-8,'#3f6fb5');
  // F 处直角标记（≥第2步）
  if(cur>=1){ctx.strokeStyle='#2e7d5b';ctx.lineWidth=1.4;
    ctx.strokeRect(bx(Bp.x)-9,byy(Bp.y),9,9);
    lab('AF=6  EF=3  ∠AFE=90°',bx(0)+16,byy(1.15),'#2e7d5b');}
  // G 与射线 AG（≥第3步显示 G；第4步标 FG；第5步标 AG）
  const G={x:4.5,y:6};
  if(cur>=2){
    ctx.setLineDash([4,4]);ctx.strokeStyle='#c2564a';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(bx(0),byy(0));ctx.lineTo(bx(7.2),byy(9.6));ctx.stroke();ctx.setLineDash([]);
    dot(bx(G.x),byy(G.y),'#c2564a',6);lab('G',bx(G.x)-18,byy(G.y)-8,'#c2564a');
    ctx.strokeStyle='#c2564a';ctx.beginPath();ctx.moveTo(bx(0),byy(6));ctx.lineTo(bx(G.x),byy(6));ctx.stroke();
    lab('DG',bx(G.x/2),byy(6)+20,'#c2564a');
  }
  if(cur>=3){ctx.strokeStyle='#3f6fb5';ctx.lineWidth=2.4;ctx.beginPath();
    ctx.moveTo(bx(FPT.x),byy(FPT.y));ctx.lineTo(bx(G.x),byy(G.y));ctx.stroke();
    lab('FG=6−x',bx(4.15),byy(5.55),'#3f6fb5');}
  if(cur>=4){ctx.strokeStyle='#b98a2f';ctx.lineWidth=2.4;ctx.beginPath();
    ctx.moveTo(bx(0),byy(0));ctx.lineTo(bx(G.x),byy(G.y));ctx.stroke();
    lab('AG=6+FG=12−x',bx(1.1),byy(3.4),'#b98a2f');
    chip(bx(3.4),byy(1.4),'(12−x)²=36+x² ⇒ DG=4.5','#2e7d5b');}
  lab('x = DG 的长',bx(0.1),byy(2.2),'#6b7a70');
}

/* ================= 题 C：两种方案比较（一次函数与不等式） ================= */
// A 方案 y=80x；B 方案 y=40x+400；x=10 时相等（800 元）
const A3={scx:28,scy:0.21,ox:70,oy:560};
const cx_=x=>A3.ox+x*A3.scx, cy_=y=>A3.oy-y*A3.scy;
let nx=12; // 人数
function drawC(){
  clearCanvas();
  // 网格与坐标轴
  ctx.strokeStyle='#eef1ec';ctx.lineWidth=1;
  for(let gx=0;gx<=22;gx+=2){ctx.beginPath();ctx.moveTo(cx_(gx),0);ctx.lineTo(cx_(gx),H);ctx.stroke();}
  for(let gy=0;gy<=1200;gy+=200){ctx.beginPath();ctx.moveTo(0,cy_(gy));ctx.lineTo(W,cy_(gy));ctx.stroke();}
  ctx.strokeStyle='#8a9a8f';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx_(0),cy_(0));ctx.lineTo(cx_(22),cy_(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx_(0),cy_(0));ctx.lineTo(cx_(0),cy_(1350));ctx.stroke();
  ctx.fillStyle='#6b7a70';ctx.font='13px sans-serif';
  ctx.fillText('人数 x',cx_(20.5),cy_(0)+24);
  ctx.fillText('费用 y',cx_(0.3),cy_(1330));
  for(let gy=0;gy<=1200;gy+=400){ctx.fillText(String(gy),cx_(0)-36,cy_(gy)+4);}
  for(let gx=5;gx<=20;gx+=5){ctx.fillText(String(gx),cx_(gx)-6,cy_(0)+20);}
  // 更省区域着色（≥第4步）：x<10 时 A 线更低；x>10 时 B 线更低
  if(cur>=3){
    ctx.fillStyle='rgba(46,125,91,.09)';
    ctx.fillRect(cx_(0),cy_(1300),cx_(10)-cx_(0),cy_(0)-cy_(1300));
    ctx.fillStyle='rgba(63,111,181,.09)';
    ctx.fillRect(cx_(10),cy_(1300),cx_(22)-cx_(10),cy_(0)-cy_(1300));
    lab('A 更省',cx_(3.6),cy_(1180),'#2e7d5b');
    lab('B 更省',cx_(15),cy_(1180),'#3f6fb5');
  }
  // A 方案射线
  ctx.strokeStyle='#2e7d5b';ctx.lineWidth=2.5;ctx.beginPath();
  ctx.moveTo(cx_(0),cy_(0));ctx.lineTo(cx_(16),cy_(80*16));ctx.stroke();
  lab('A：y=80x',cx_(8.4),cy_(80*8.4+40),'#2e7d5b');
  // B 方案射线（≥第2步）
  if(cur>=1){
    ctx.strokeStyle='#3f6fb5';ctx.lineWidth=2.5;ctx.beginPath();
    ctx.moveTo(cx_(0),cy_(400));ctx.lineTo(cx_(22),cy_(40*22+400));ctx.stroke();
    dot(cx_(0),cy_(400),'#3f6fb5');lab('(0, 400) 起步价',cx_(0.5),cy_(400)-12,'#3f6fb5');
    lab('B：y=40x+400',cx_(13.2),cy_(40*13.2+400)-16,'#3f6fb5');
  }
  // 交点（≥第3步）
  if(cur>=2){
    ctx.setLineDash([4,4]);ctx.strokeStyle='#b98a2f';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(cx_(10),cy_(0));ctx.lineTo(cx_(10),cy_(800));ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx_(0),cy_(800));ctx.lineTo(cx_(10),cy_(800));ctx.stroke();
    ctx.setLineDash([]);
    dot(cx_(10),cy_(800),'#b98a2f',7);lab('(10, 800)',cx_(10.4),cy_(800)-14,'#b98a2f');
  }
  // 当前人数竖线与两方案取值点
  ctx.setLineDash([5,4]);ctx.strokeStyle='#c2564a';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(cx_(nx),cy_(0));ctx.lineTo(cx_(nx),cy_(80*nx));ctx.stroke();
  ctx.setLineDash([]);
  dot(cx_(nx),cy_(80*nx),'#2e7d5b',6);dot(cx_(nx),cy_(40*nx+400),'#3f6fb5',6);
  lab(`x=${nx}`,cx_(nx)-16,cy_(0)+22,'#c2564a');
  // 结论（≥第5步）
  if(cur>=4){
    const t=nx<10?'x<10：A 方案更省':nx>10?'x>10：B 方案更省':'x=10：两方案一样省';
    chip(Math.max(8,cx_(nx)-140),cy_(80*nx)-44,t,nx<10?'#2e7d5b':nx>10?'#3f6fb5':'#b98a2f');
  }
}

/* ================= 题 D：垂径定理 ================= */
// ⊙O 半径 5，弦 AB，弦心距 OM=d，AM=√(25−d²)，AB=2√(25−d²)
const A4={cx:480,cy:330,r:190};
const u4=A4.r/5; // px/单位
let dd=3; // 弦心距
function drawD(){
  clearCanvas();
  // 圆与圆心
  ctx.strokeStyle='#54655c';ctx.lineWidth=2.2;ctx.beginPath();
  ctx.arc(A4.cx,A4.cy,A4.r,0,7);ctx.stroke();
  dot(A4.cx,A4.cy,'#54655c',5);lab('O',A4.cx+10,A4.cy+5,'#54655c');
  // 弦 AB（M 为中点，位于圆心正下方 d 处）
  const am=Math.sqrt(25-dd*dd), half=am*u4;
  const Mx=A4.cx, My=A4.cy+dd*u4;
  const Bx=Mx-half, By=My, Ex2=Mx+half, Ey2=My;
  ctx.strokeStyle='#c2564a';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(Bx,By);ctx.lineTo(Ex2,Ey2);ctx.stroke();
  lab('A',Bx-20,By+5,'#c2564a');lab('B',Ex2+12,By+5,'#c2564a');
  // OM 与直角标记（≥第2步）
  if(cur>=1){
    ctx.strokeStyle='#2e7d5b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(A4.cx,A4.cy);ctx.lineTo(Mx,My);ctx.stroke();
    ctx.strokeStyle='#2e7d5b';ctx.lineWidth=1.4;
    ctx.strokeRect(Mx-9,My-9,9,9);
    dot(Mx,My,'#2e7d5b',6);lab('M',Mx+14,My+16,'#2e7d5b');
    lab('OM⊥AB',Mx+22,My+34,'#2e7d5b');
  }
  // 半径 OA（≥第3步）
  if(cur>=2){
    ctx.strokeStyle='#3f6fb5';ctx.lineWidth=2.2;
    ctx.beginPath();ctx.moveTo(A4.cx,A4.cy);ctx.lineTo(Bx,By);ctx.stroke();
    lab('OA=r=5',A4.cx-98,A4.cy-30,'#3f6fb5');
  }
  // Rt△OAM 填充与标注（≥第4步）
  if(cur>=3){
    ctx.fillStyle='rgba(63,111,181,.13)';
    ctx.beginPath();ctx.moveTo(A4.cx,A4.cy);ctx.lineTo(Bx,By);ctx.lineTo(Mx,My);ctx.closePath();ctx.fill();
    lab(`AM=${am.toFixed(2)}=√(25−d²)`,Mx-half/2-70,My-14,'#3f6fb5');
    lab(`d=${dd.toFixed(1)}`,Mx+14,(A4.cy+My)/2,'#2e7d5b');
  }
  // 结论（≥第5步）
  if(cur>=4){
    chip(Math.min(W-220,A4.cx-90),My+44,`AB = 2AM = ${(2*am).toFixed(2)}（d=${dd.toFixed(1)}）`,'#2e7d5b');
  }
  lab('拖动滑块改变弦心距 d',30,H-18,'#6b7a70');
}

const P=()=>PROBS[prob];
function renderSteps(){
  const box=document.getElementById('stepList');box.innerHTML='';
  P().steps.forEach((s,i)=>{
    const locked=i>cur;
    const div=document.createElement('div');div.className='step'+(i===cur?' on':'')+(locked?' locked':'');
    let inner=`<span class="no">${i+1}</span><h4>${s.t}</h4>`;
    if(!locked){
      inner+=`<div class="body">${s.b}`;
      if(i===cur&&!s.passed){ // 当前步未过关：显示点选关
        inner+=`<div class="quiz"><div class="q">〔过关点选〕${s.q}</div><div class="opts">`+
          s.o.map((o,j)=>`<button class="opt" onclick="pick(${i},${j},this)">${'ABC'[j]}. ${o}</button>`).join('')+
          `</div><div class="hint">✗ ${s.hint} 再试一次。</div></div>`;
      }else if(s.passed){inner+=`<div class="done">✓ 已过关</div>`;}
      inner+=`</div>`;
    }
    div.innerHTML=inner;box.appendChild(div);
  });
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').disabled=cur>=P().steps.length-1||!P().steps[cur].passed;
  document.getElementById('formula').textContent='【核心式】'+P().formula(cur);
  // 读数
  const ro=document.getElementById('readout');
  ro.innerHTML=P().readout().map(([k,v])=>`<span class="chip">${k}：<b>${v}</b></span>`).join('');
}
function pick(si,oi,btn){
  const s=P().steps[si];
  if(oi===s.a){s.passed=true;btn.classList.add('good');
    setTimeout(()=>{if(cur===si)cur=Math.min(cur+1,P().steps.length-1);syncUI();},420);}
  else{btn.classList.add('bad');const h=btn.closest('.quiz').querySelector('.hint');h.style.display='block';
    setTimeout(()=>btn.classList.remove('bad'),350);}
}
function nav(d){const n=cur+d;if(n<0||n>=P().steps.length)return;
  if(d>0&&!P().steps[cur].passed)return;cur=n;syncUI();}
function syncUI(){renderSteps();P().draw();
  document.getElementById('sliderLabel').textContent=P().slider.label;}
function buildTabs(){
  const box=document.getElementById('tabs');box.innerHTML='';
  PROBS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===prob?' on':'');b.textContent=p.tab;
    b.onclick=()=>switchProb(i);box.appendChild(b);
  });}
function switchProb(i){prob=i;cur=0;P().steps.forEach(s=>s.passed=false);
  buildTabs();
  const sl=document.getElementById('slider');
  sl.min=P().slider.min;sl.max=P().slider.max;sl.value=P().slider.val;
  P().apply(+sl.value);document.getElementById('sliderVal').textContent=P().slider.fmt(+sl.value);
  syncUI();}
document.getElementById('slider').addEventListener('input',e=>{
  P().apply(+e.target.value);
  document.getElementById('sliderVal').textContent=P().slider.fmt(+e.target.value);
  P().draw();});
/* 画布拖动（题A 直接拖 P） */
function canvasDrag(clientX){
  const r=cv.getBoundingClientRect(),mx=(clientX-r.left)*(W/r.width),my=(clientY-r.top)*(H/r.height);
  if(P().name!=='A')return;
  const x=Math.min(2.9,Math.max(0.1,(mx-A1.ox)/A1.sc));
  px=x;const sl=document.getElementById('slider');
  sl.value=Math.round(x*1000);document.getElementById('sliderVal').textContent=P().slider.fmt(x*1000);
  P().draw();}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);canvasDrag(e.clientX);});
cv.addEventListener('pointermove',e=>{if(e.buttons)canvasDrag(e.clientX);});
const _qp = parseInt(new URLSearchParams(location.search).get('p'), 10);
switchProb(_qp >= 0 && _qp < PROBS.length ? _qp : 0);
